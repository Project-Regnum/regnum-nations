plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"regnum-nations" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

fabricApi {
	configureDataGeneration {
		client = true
		modId = "regnum-nations"
	}

	// Exercise persistence in a real server world using the existing Fabric API.
	configureTests {
		createSourceSet = true
		modId = "regnum-nations-test"
		enableClientGameTests = false
	}
}

// GameTests use fixed locations and live saved data. Start each run with a fresh
// disposable test world; never touch the development server world under run/.
def resetGameTestWorld = tasks.register('resetGameTestWorld', Delete) {
	delete layout.buildDirectory.dir('run/gameTest/world')
}

tasks.named('runGameTest') {
	dependsOn resetGameTestWorld
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

// Opt-in client verification in a disposable game directory, without adding a test library.
sourceSets {
	atlasTest {
		compileClasspath += sourceSets.client.compileClasspath + sourceSets.client.output + sourceSets.main.output
		runtimeClasspath += sourceSets.client.runtimeClasspath + sourceSets.client.output + sourceSets.main.output
	}
}
loom {
	mods {
		"regnum-nations-atlas-test" { sourceSet sourceSets.atlasTest }
	}
	runs {
		atlasTest {
			client()
			name 'Living Atlas client checks'
			source sourceSets.atlasTest
			runDir 'build/run/atlasTest'
			vmArg '-Dregnum.atlasTest=true'
			programArgs '--width', '1100', '--height', '760'
		}
        heraldryVisualTest {
            client()
            name 'Heraldry and royal banner visual checks'
            source sourceSets.atlasTest
            runDir 'build/run/heraldryVisualTest'
            vmArg '-Dregnum.heraldryVisual=true'
            programArgs '--width', '1100', '--height', '760'
        }
        multiplayerAuditOne {
            client()
            name 'Nations multiplayer audit first client'
            source sourceSets.atlasTest
            runDir 'build/run/multiplayerAuditOne'
            vmArg '-Dregnum.multiplayerActor=1'
            programArgs '--username', 'AuditOne', '--width', '640', '--height', '480'
        }
        multiplayerAuditTwo {
            client()
            name 'Nations multiplayer audit second client'
            source sourceSets.atlasTest
            runDir 'build/run/multiplayerAuditTwo'
            vmArg '-Dregnum.multiplayerActor=2'
            programArgs '--username', 'AuditTwo', '--width', '640', '--height', '480'
        }
        integrationLayoutTest {
            client()
            name 'Nations integration UI layout checks'
            source sourceSets.atlasTest
            runDir 'build/run/integrationLayoutTest'
            vmArg '-Dregnum.integrationLayout=true'
            programArgs '--width', '1100', '--height', '760'
        }
	}
}

// Pure rule checks without adding a test-library dependency. Server integration stays in GameTests.
sourceSets {
	rulesTest {
		compileClasspath += sourceSets.main.output
		runtimeClasspath += sourceSets.main.output
	}
}

tasks.register('testKingdomNames', JavaExec) {
	group = 'verification'
	description = 'Checks kingdom display-name and uniqueness rules without Minecraft startup.'
	dependsOn tasks.named('rulesTestClasses')
	classpath = sourceSets.rulesTest.runtimeClasspath
	mainClass = 'dev.sakhno.regnum.nations.kingdom.KingdomNameTest'
}

tasks.named('check') {
	dependsOn tasks.named('testKingdomNames')
}

// Opt-in asset review in a disposable client world. Never uses the player's run/.
sourceSets {
	obeliskTest {
		compileClasspath += sourceSets.client.compileClasspath + sourceSets.client.output + sourceSets.main.output
		runtimeClasspath += sourceSets.client.runtimeClasspath + sourceSets.client.output + sourceSets.main.output
	}
}
loom {
	mods { "regnum-nations-obelisk-test" { sourceSet sourceSets.obeliskTest } }
	runs {
		obeliskTest {
			client()
			name 'Obelisk visual checks'
			source sourceSets.obeliskTest
			runDir 'build/run/obeliskTest'
			vmArg '-Dregnum.obeliskTest=true'
			programArgs '--width', '1280', '--height', '900'
		}
	}
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
	from('third_party/diorama/LICENSE') { into 'META-INF/licenses/diorama' }
	from('THIRD_PARTY_NOTICES.md')
}

tasks.named('sourcesJar') {
	from('third_party/diorama') { into 'third_party/diorama' }
	from('THIRD_PARTY_NOTICES.md')
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}

// Loom runs on the build JVM; execute gameplay/rule verification on the supported runtime.
['runGameTest', 'testKingdomNames', 'runIntegrationLayoutTest', 'runHeraldryVisualTest', 'runMultiplayerAuditOne', 'runMultiplayerAuditTwo'].each { taskName ->
    tasks.named(taskName, JavaExec) {
        javaLauncher = javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(21)
        }
        doFirst { logger.lifecycle("Verification runtime: Java ${javaLauncher.get().metadata.languageVersion}") }
    }
}
